{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keepup-httproute
  {{- if .Values.gatewayApi.annotations }}
  annotations: {{ toYaml .Values.gatewayApi.annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  {{- if .Values.gatewayApi.host }}
  hostnames:
    - {{ .Values.gatewayApi.host | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /os-release
        - path:
            type: PathPrefix
            value: /helm-cluster
        - path:
            type: PathPrefix
            value: /package-version
      backendRefs:
        - name: keepup-service
          port: 80
{{ end }}
