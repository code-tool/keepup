apiVersion: apps/v1
kind: Deployment
metadata:
  name: keepup-deployment
  labels:
    app: keepup
    type: backend
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: keepup
      type: backend
  replicas: {{ default 1 .Values.replicas }}
  template:
    metadata:
      labels:
        app: keepup
        type: backend
      {{- if or .Values.annotations .Values.portfolio.enabled }}
      annotations:
        {{- with .Values.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.portfolio.enabled }}
        checksum/portfolio: {{ include (print $.Template.BasePath "/config-portfolio.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      containers:
{{ if .Values.redis.enabled  }}
        - name: keepup-redis-container
          imagePullPolicy: {{ .Values.redis.pullPolicy }}
          image: {{ .Values.redis.image | quote }}
          {{- with .Values.redis.securityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
{{ end }}
        - name: keepup-main-container
          imagePullPolicy: {{ .Values.main.pullPolicy }}
          image: "{{ .Values.main.image }}:{{ .Values.main.tag | default .Chart.AppVersion }}"
          env:
            {{ include "project.config" . | indent 12 }}
          {{- with .Values.main.securityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.portfolio.enabled }}
          volumeMounts:
            - name: portfolio
              mountPath: /etc/keepup/portfolio
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.listenPort | int }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 60
      {{- if .Values.portfolio.enabled }}
      volumes:
        - name: portfolio
          projected:
            sources:
              {{- if .Values.portfolio.teams }}
              - configMap:
                  name: keepup-portfolio
              {{- end }}
              {{- range .Values.portfolio.existingConfigMaps }}
              - configMap:
                  name: {{ . }}
              {{- end }}
      {{- end }}
