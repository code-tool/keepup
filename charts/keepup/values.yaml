replicas: 1

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

main:
  image: "ghcr.io/code-tool/keepup"
  tag: ""
  pullPolicy: "IfNotPresent"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

redis:
  enabled: true
  image: "redis:8.2.8"
  pullPolicy: "IfNotPresent"
  # the official redis image's built-in non-root user
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

ingress:
  enabled: true
  pathType: ImplementationSpecific
  ingressClassName: ""
  tls: false
  secretName: ""
  host: ""
  annotations: {}
  #  kubernetes.io/ingress.class: nginx
  #  nginx.ingress.kubernetes.io/service-upstream: "true"
  #  nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

gatewayApi:
  enabled: false
  # parentRefs:
  #   - name: my-gateway
  #     namespace: gateway-system
  #     sectionName: https
  parentRefs: []
  host: ""
  annotations: {}

servicemonitor:
  enabled: true

annotations: {}
#  "prometheus.io/scrape": 'true'
#  "prometheus.io/port": '80'
#  "prometheus.io/path": '/metrics'

nodeSelector: {}
#  kubernetes.io/os: linux

tolerations: []
#  - key: "example-key"
#    operator: "Exists"
#    effect: "NoSchedule"

apiToken: ''
appEnv: prod
listenPort: '9101'
redisAddr: 127.0.0.1
redisPort: '6379'
redisDbNo: '7'
ttlSeconds: '21600'
