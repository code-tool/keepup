replicas: 1

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

main:
  image: "ghcr.io/code-tool/keepup"
  tag: ""
  pullPolicy: "IfNotPresent"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

redis:
  enabled: true
  image: "redis:8.2.10"
  pullPolicy: "IfNotPresent"
  # the official redis image's built-in non-root user
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

ingress:
  enabled: true
  pathType: ImplementationSpecific
  ingressClassName: ""
  tls: false
  secretName: ""
  host: ""
  annotations: {}
  #  kubernetes.io/ingress.class: nginx
  #  nginx.ingress.kubernetes.io/service-upstream: "true"
  #  nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

gatewayApi:
  enabled: false
  # parentRefs:
  #   - name: my-gateway
  #     namespace: gateway-system
  #     sectionName: https
  parentRefs: []
  host: ""
  annotations: {}

servicemonitor:
  enabled: true

annotations: {}
#  "prometheus.io/scrape": 'true'
#  "prometheus.io/port": '80'
#  "prometheus.io/path": '/metrics'

nodeSelector: {}
#  kubernetes.io/os: linux

tolerations: []
#  - key: "example-key"
#    operator: "Exists"
#    effect: "NoSchedule"

# Per-team maintenance catalogs
portfolio:
  enabled: false
  teams: {}
  #  team-a:
  #    capacity_days: 59.4
  #    objects:
  #      - name: mongo replicaset
  #        environment: prod         # prod | non-prod
  #        source: package           # package | helm | static
  #        key: mongodb              # package_name / chart_name
  #        maintenances_per_year: 2
  #        hours_per_object: 0.5
  #        automation_factor: 1
  # ConfigMaps managed elsewhere, each with one or more <team>.yaml keys
  existingConfigMaps: []

apiToken: ''
appEnv: prod
listenPort: '9101'
redisAddr: 127.0.0.1
redisPort: '6379'
redisDbNo: '7'
ttlSeconds: '21600'
